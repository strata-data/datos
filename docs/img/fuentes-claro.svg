<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 944" width="1200" height="944" role="img" aria-label="De dónde sale cada documento: fuentes, cómo se obtienen y años" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif"><title>De dónde sale cada documento: fuentes, cómo se obtienen y años</title><rect width="1200" height="944" rx="16" fill="#F1ECE2"/><text x="56" y="72" font-size="34" font-weight="700" fill="#1C1F22" letter-spacing="-0.7">De dónde sale cada documento</text><text x="56" y="108" font-size="21" fill="#5A5650">168 documentos oficiales de 32 fuentes en 18 grupos.</text><text x="56" y="168" font-size="13" font-weight="700" fill="#5A5650" text-anchor="start">FUENTE</text><text x="470" y="168" font-size="13" font-weight="700" fill="#5A5650" text-anchor="end">DOCUMENTOS</text><text x="510" y="168" font-size="13" font-weight="700" fill="#5A5650" text-anchor="start">CÓMO SE OBTIENEN</text><text x="1144" y="168" font-size="13" font-weight="700" fill="#5A5650" text-anchor="end">AÑOS</text><line x1="56" x2="1144" y1="206" y2="206" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="233" font-size="16" fill="#1C1F22">Banco Central (BCE)</text><text x="470" y="233" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">37</text><text x="510" y="233" font-size="15" fill="#5A5650">27 Reportes de Minería en PDF, uno por uno</text><text x="1144" y="233" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2013 a 2026</text><line x1="56" x2="1144" y1="244" y2="244" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="271" font-size="16" fill="#1C1F22">Lundin Gold (Fruta del Norte)</text><text x="470" y="271" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">27</text><text x="510" y="271" font-size="15" fill="#5A5650">Un reporte por trimestre, uno por uno</text><text x="1144" y="271" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2020 a 2026</text><line x1="56" x2="1144" y1="282" y2="282" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="309" font-size="16" fill="#1C1F22">Informes técnicos NI 43-101</text><text x="470" y="309" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">19</text><text x="510" y="309" font-size="15" fill="#5A5650">Un PDF por proyecto, 274 MB en total</text><text x="1144" y="309" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2006 a 2026</text><line x1="56" x2="1144" y1="320" y2="320" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="347" font-size="16" fill="#1C1F22">SRI</text><text x="470" y="347" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">44</text><text x="510" y="347" font-size="15" fill="#5A5650">Un CSV por año con todo el país</text><text x="1144" y="347" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2000 a 2026</text><line x1="56" x2="1144" y1="358" y2="358" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="385" font-size="16" fill="#1C1F22">Leyes y sentencias</text><text x="470" y="385" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">8</text><text x="510" y="385" font-size="15" fill="#5A5650">PDF del Registro Oficial y de la Corte</text><text x="1144" y="385" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">1989 a 2026</text><line x1="56" x2="1144" y1="396" y2="396" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="423" font-size="16" fill="#1C1F22">MAATE (áreas protegidas)</text><text x="470" y="423" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">4</text><text x="510" y="423" font-size="15" fill="#5A5650">Capas de mapas</text><text x="1144" y="423" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2023</text><line x1="56" x2="1144" y1="434" y2="434" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="461" font-size="16" fill="#1C1F22">INAMHI (clima)</text><text x="470" y="461" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">4</text><text x="510" y="461" font-size="15" fill="#5A5650">Un CSV por variable</text><text x="1144" y="461" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">1960 a 2019</text><line x1="56" x2="1144" y1="472" y2="472" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="499" font-size="16" fill="#1C1F22">CENACE y CELEC (energía)</text><text x="470" y="499" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">4</text><text x="510" y="499" font-size="15" fill="#5A5650">CSV y un plan en PDF</text><text x="1144" y="499" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2018 a 2027</text><line x1="56" x2="1144" y1="510" y2="510" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="537" font-size="16" fill="#1C1F22">IGM (cartografía)</text><text x="470" y="537" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">4</text><text x="510" y="537" font-size="15" fill="#5A5650">Capas de mapas</text><text x="1144" y="537" font-size="15" fill="#CFC7B8" text-anchor="end" style="font-variant-numeric:tabular-nums">sin año fijo</text><line x1="56" x2="1144" y1="548" y2="548" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="575" font-size="16" fill="#1C1F22">SERCOP y ENAMI</text><text x="470" y="575" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">3</text><text x="510" y="575" font-size="15" fill="#5A5650">CSV, JSON y hoja ODS</text><text x="1144" y="575" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2015 a 2024</text><line x1="56" x2="1144" y1="586" y2="586" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="613" font-size="16" fill="#1C1F22">INEC (empleo y territorio)</text><text x="470" y="613" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">2</text><text x="510" y="613" font-size="15" fill="#5A5650">Un ZIP con los cuadros de empleo, uno con el mapa de parroquias y un Excel</text><text x="1144" y="613" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2022 a 2026</text><line x1="56" x2="1144" y1="624" y2="624" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="651" font-size="16" fill="#1C1F22">Bolsas y transacciones</text><text x="470" y="651" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">2</text><text x="510" y="651" font-size="15" fill="#5A5650">JSON y páginas web</text><text x="1144" y="651" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2014 a 2024</text><line x1="56" x2="1144" y1="662" y2="662" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="689" font-size="16" fill="#1C1F22">ARCOM (catastro)</text><text x="470" y="689" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">3</text><text x="510" y="689" font-size="15" fill="#5A5650">Servicio de mapas, 6.366 polígonos</text><text x="1144" y="689" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2026</text><line x1="56" x2="1144" y1="700" y2="700" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="727" font-size="16" fill="#1C1F22">Registros del SRI y la Superintendencia</text><text x="470" y="727" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">2</text><text x="510" y="727" font-size="15" fill="#5A5650">Excel y CSV de todo el país</text><text x="1144" y="727" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2024</text><line x1="56" x2="1144" y1="738" y2="738" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="765" font-size="16" fill="#1C1F22">Banco Mundial (precios)</text><text x="470" y="765" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">2</text><text x="510" y="765" font-size="15" fill="#5A5650">Un Excel mensual y uno anual</text><text x="1144" y="765" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">1960 a 2026</text><line x1="56" x2="1144" y1="776" y2="776" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="803" font-size="16" fill="#1C1F22">Superintendencia de Compañías</text><text x="470" y="803" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">1</text><text x="510" y="803" font-size="15" fill="#5A5650">Un Excel de 36 MB, todas las compañías</text><text x="1144" y="803" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2024</text><line x1="56" x2="1144" y1="814" y2="814" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="841" font-size="16" fill="#1C1F22">IIGE (geología)</text><text x="470" y="841" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">1</text><text x="510" y="841" font-size="15" fill="#5A5650">Un mapa geológico de 92 MB</text><text x="1144" y="841" font-size="15" fill="#CFC7B8" text-anchor="end" style="font-variant-numeric:tabular-nums">sin año fijo</text><line x1="56" x2="1144" y1="852" y2="852" stroke="#CFC7B8" stroke-width="1"/><text x="56" y="879" font-size="16" fill="#1C1F22">CONALI (límites)</text><text x="470" y="879" font-size="16" font-weight="700" fill="#1C1F22" text-anchor="end" style="font-variant-numeric:tabular-nums">1</text><text x="510" y="879" font-size="15" fill="#5A5650">Capa de cantones</text><text x="1144" y="879" font-size="15" fill="#5A5650" text-anchor="end" style="font-variant-numeric:tabular-nums">2022</text><text x="56" y="914" font-size="13" fill="#5A5650">Censo auditado (2026-11-25): documentos únicos identificados por huella SHA-256.</text></svg>