<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" width="1200" height="352" role="img" aria-label="Formatos disponibles: CSV y SQLite" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif"><title>Formatos disponibles: CSV y SQLite</title><rect width="1200" height="352" rx="16" fill="#1C1F22"/><text x="56" y="72" font-size="34" font-weight="700" fill="#F1ECE2" letter-spacing="-0.7">Descárguelo en el formato que prefiera</text><text x="56" y="108" font-size="21" fill="#A9A398">Cada versión publicada incluye los CSV normalizados y el generador de SQLite.</text><text x="56" y="168" font-size="13" font-weight="700" fill="#A9A398">FORMATO</text><text x="420" y="168" font-size="13" font-weight="700" fill="#A9A398">PARA QUÉ SIRVE</text><line x1="56" x2="1144" y1="208" y2="208" stroke="#3E4348" stroke-width="1"/><svg x="56" y="220" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6FA393" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM3 10h18M9 5v14"/></svg><text x="92" y="239" font-size="18" font-weight="700" fill="#F1ECE2">CSV (UTF-8)</text><text x="420" y="239" font-size="17" fill="#A9A398">Abrir en Excel, R, Python o cualquier programa (en src/data/csv/)</text><line x1="56" x2="1144" y1="252" y2="252" stroke="#3E4348" stroke-width="1"/><svg x="56" y="264" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6FA393" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><text x="92" y="283" font-size="18" font-weight="700" fill="#F1ECE2">SQLite (.db)</text><text x="420" y="283" font-size="17" fill="#A9A398">Base relacional local con vistas públicas generada por python build_engine.py</text><text x="56" y="322" font-size="13" fill="#A9A398">Generación local determinista con python build_engine.py y validación SHA-256.</text></svg>