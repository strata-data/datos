<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Comprobar una cifra en tres pasos: descargue, arrastre y listo" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif"><title>Comprobar una cifra en tres pasos: descargue, arrastre y listo</title><rect width="1200" height="500" rx="16" fill="#F1ECE2"/><text x="56" y="72" font-size="34" font-weight="700" fill="#1C1F22" letter-spacing="-0.7">Comprobar una cifra es así de fácil</text><text x="56" y="108" font-size="21" fill="#5A5650">Si sale verde, es exactamente el mismo archivo que usó Strata.</text><rect x="56" y="140" width="346" height="290" rx="16" fill="#E7E0D2"/><path d="M229 178 v58 M207 214 l22 22 l22 -22" fill="none" stroke="#1C1F22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M189 238 v18 h80 v-18" fill="none" stroke="#1C1F22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="229" y="316" font-size="34" font-weight="700" fill="#1C1F22" text-anchor="middle" letter-spacing="-0.7">1. Descargue</text><text x="229" y="356" font-size="18" fill="#5A5650" text-anchor="middle">el archivo desde la web</text><text x="229" y="384" font-size="18" fill="#5A5650" text-anchor="middle">de la institución</text><rect x="426" y="140" width="346" height="290" rx="16" fill="#E7E0D2"/><rect x="539" y="176" width="120" height="86" rx="10" fill="none" stroke="#2F4A43" stroke-width="3" stroke-dasharray="10 7"/><rect x="581" y="196" width="36" height="46" rx="4" fill="#5A5650"/><text x="599" y="316" font-size="34" font-weight="700" fill="#1C1F22" text-anchor="middle" letter-spacing="-0.7">2. Arrástrelo</text><text x="599" y="356" font-size="18" fill="#5A5650" text-anchor="middle">a stratadata.app/verificar</text><text x="599" y="384" font-size="18" fill="#5A5650" text-anchor="middle">No sale de su computadora.</text><rect x="796" y="140" width="346" height="290" rx="16" fill="#E7E0D2"/><circle cx="969" cy="218" r="42" fill="none" stroke="#007A5A" stroke-width="5"/><path d="M951 218 l12 12 l24 -26" fill="none" stroke="#007A5A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="969" y="316" font-size="34" font-weight="700" fill="#007A5A" text-anchor="middle" letter-spacing="-0.7">3. Listo</text><text x="969" y="356" font-size="18" fill="#5A5650" text-anchor="middle">Verde: coincide.</text><text x="969" y="384" font-size="18" fill="#5A5650" text-anchor="middle">Morado: no es el mismo archivo.</text><text x="56" y="470" font-size="14" fill="#5A5650">Ejemplo ilustrativo. Para expertos: la web calcula la huella SHA-256 del archivo y la compara con la que registró Strata.</text></svg>